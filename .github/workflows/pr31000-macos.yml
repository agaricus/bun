name: PR 31000 cross-platform verification

on:
  workflow_dispatch:
    inputs:
      bun_sha:
        description: Full commit SHA from oven-sh/bun to test
        required: true
        type: string
        default: 056352c391c0d6b476bace1f41874dc9b4d9c5d9
      skip_macos:
        description: Skip macOS when rerunning selected lanes
        required: false
        type: boolean
        default: false
      skip_windows:
        description: Skip Windows when rerunning selected lanes
        required: false
        type: boolean
        default: false
      skip_linux:
        description: Skip Linux when rerunning selected lanes
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-x64:
    if: ${{ !inputs.skip_macos }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash

      - name: Install LLVM 23.1.1
        shell: bash -el {0}
        run: |
          micromamba create -y -p "$RUNNER_TEMP/llvm23" -c conda-forge llvm=23.1.1 clang=23.1.1
          echo "BUN_TOOLCHAIN_LLVM=$RUNNER_TEMP/llvm23" >> "$GITHUB_ENV"

      - name: Install NASM
        run: brew install nasm

      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch "$XCODE_26_DEVELOPER_DIR"
          xcodebuild -version

      - name: Record runner and revision
        working-directory: bun
        run: |
          uname -a
          git rev-parse HEAD
          bun --version

      - name: Build debug Bun and run focused suites
        working-directory: bun
        shell: bash
        run: |
          set -o pipefail
          bun bd test \
            test/cli/install/npmrc.test.ts \
            test/js/web/fetch/fetch.tls.test.ts \
            test/js/web/fetch/fetch-redirect.test.ts \
            test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts \
            test/cli/install/bun-install-retry.test.ts \
            test/cli/install/bun-pm-diff.test.ts 2>&1 | tee ../macos-test.log

      - name: Upload tested macos-x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-macos-x64-debug
          path: bun/build/debug/bun-debug
          if-no-files-found: error

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-macos-x64-${{ inputs.bun_sha }}
          path: macos-test.log
          if-no-files-found: ignore

  linux-x64:
    if: ${{ !inputs.skip_linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash

      - name: Install LLVM 23 and native build tools
        shell: bash
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 23
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev nasm g++
          echo "BUN_TOOLCHAIN_LLVM=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Build debug Bun and run focused suites
        working-directory: bun
        shell: bash
        run: |
          set -o pipefail
          bun bd test test/cli/install/npmrc.test.ts test/js/web/fetch/fetch.tls.test.ts test/js/web/fetch/fetch-redirect.test.ts test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts test/cli/install/bun-install-retry.test.ts test/cli/install/bun-pm-diff.test.ts 2>&1 | tee ../linux-test.log

      - name: Upload tested linux-x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-linux-x64-debug
          path: bun/build/debug/bun-debug
          if-no-files-found: error

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-linux-x64-${{ inputs.bun_sha }}
          path: linux-test.log
          if-no-files-found: ignore

  windows-x64:
    if: ${{ !inputs.skip_windows }}
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2

      - name: Install LLVM 23.1.1 and NASM
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'LLVM-23.1.1-win64.msi'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-win64.msi'
          Invoke-WebRequest -Uri $url -OutFile $msi
          $proc = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "LLVM MSI exited with $($proc.ExitCode)" }
          $installDir = Join-Path $env:ProgramFiles 'LLVM'
          if (!(Test-Path (Join-Path $installDir 'bin\clang-cl.exe'))) { throw "clang-cl.exe missing from $installDir" }
          & (Join-Path $installDir 'bin\clang-cl.exe') --version
          "BUN_TOOLCHAIN_LLVM=$installDir" >> $env:GITHUB_ENV
          "$installDir\bin" >> $env:GITHUB_PATH
          choco install nasm -y --no-progress
          $nasmCandidates = @(
            (Join-Path $env:ProgramFiles 'NASM\nasm.exe'),
            'C:\ProgramData\chocolatey\lib\nasm\tools\nasm.exe',
            'C:\ProgramData\chocolatey\bin\nasm.exe'
          )
          $nasmExe = $nasmCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$nasmExe) { throw 'nasm.exe was installed but not found in expected Chocolatey locations' }
          $nasmDir = Split-Path $nasmExe
          & $nasmExe -v
          "$nasmDir" >> $env:GITHUB_PATH

      - name: Build debug Bun and run focused suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          subst B: "$env:GITHUB_WORKSPACE\bun"
          Set-Location 'B:\'
          pwsh -NoProfile -File .\scripts\vs-shell.ps1 bun bd test test/cli/install/npmrc.test.ts test/js/web/fetch/fetch.tls.test.ts test/js/web/fetch/fetch-redirect.test.ts test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts test/cli/install/bun-install-retry.test.ts test/cli/install/bun-pm-diff.test.ts 2>&1 | Tee-Object -FilePath ../windows-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload tested windows-x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-windows-x64-debug
          path: bun/build/debug/bun-debug.exe
          if-no-files-found: error

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-windows-x64-${{ inputs.bun_sha }}
          path: windows-test.log
          if-no-files-found: ignore

  publish-prerelease:
    if: ${{ !inputs.skip_macos && !inputs.skip_windows && !inputs.skip_linux }}
    needs: [macos-x64, windows-x64, linux-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested platform binaries
        uses: actions/download-artifact@v4
        with:
          name: pr31000-macos-x64-debug
          path: release-inputs/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: pr31000-windows-x64-debug
          path: release-inputs/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: pr31000-linux-x64-debug
          path: release-inputs/linux-x64

      - name: Package Maven JARs and ZIPs from tested binaries
        env:
          BUN_SHA: ${{ inputs.bun_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('release-inputs')
          out = pathlib.Path('release-assets')
          out.mkdir()
          version = f"1.4.4-pr31000-{__import__('os').environ['BUN_SHA'][:11]}-debug"
          for target, exe_name in [('darwin-x64', 'bun'), ('windows-x64', 'bun.exe'), ('linux-x64', 'bun')]:
              files = list((root / target).glob('bun-debug*'))
              if len(files) != 1:
                  raise SystemExit(f'{target}: expected one tested bun-debug binary, found {files}')
              binary = files[0]
              dest = out / f'bun-{target}-{version}'
              dest.mkdir()
              exe = dest / exe_name
              exe.write_bytes(binary.read_bytes())
              exe.chmod(0o755)
              digest = hashlib.sha256(exe.read_bytes()).hexdigest()
              manifest = {'artifact_version': version, 'source_commit': __import__('os').environ['BUN_SHA'], 'target': target, 'profile': 'debug', 'binary': exe_name, 'binary_sha256': digest, 'official_release': False}
              (dest / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
              (dest / 'README.txt').write_text('Temporary debug binary built and tested in the PR 31000 fork workflow. Not an official Bun release.\n')
              zip_path = out / f'bun-{target}-{version}.zip'
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
                  z.write(exe, exe_name)
                  z.write(dest / 'manifest.json', 'manifest.json')
                  z.write(dest / 'README.txt', 'README.txt')
              jar_path = out / f'bun-{target}-{version}.jar'
              with zipfile.ZipFile(jar_path, 'w', zipfile.ZIP_DEFLATED) as z:
                  z.write(exe, f'META-INF/resources/_static/pr31000/{version}/bin/{exe_name}')
                  z.write(dest / 'manifest.json', 'META-INF/pr31000-build.json')
                  z.write(dest / 'README.txt', 'META-INF/README.txt')
          sums = []
          for path in sorted(out.iterdir()):
              if path.is_file(): sums.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}')
          (out / 'SHA256SUMS').write_text('\n'.join(sums) + '\n')
          PY

      - name: Upload assets to temporary prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload pr31000-056352c391c --repo agaricus/bun release-assets/* --clobber
