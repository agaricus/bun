name: PR 31000 cross-platform verification

on:
  workflow_dispatch:
    inputs:
      bun_sha:
        description: Full commit SHA from oven-sh/bun to test
        required: true
        type: string
        default: 056352c391c0d6b476bace1f41874dc9b4d9c5d9
      skip_macos:
        description: Skip macOS when rerunning selected lanes
        required: false
        type: boolean
        default: false
      skip_windows:
        description: Skip Windows when rerunning selected lanes
        required: false
        type: boolean
        default: false
      skip_linux:
        description: Skip Linux when rerunning selected lanes
        required: false
        type: boolean
        default: false
      reuse_platforms_from_run:
        description: Reuse Linux and Windows build artifacts from a prior workflow run
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  macos-x64-cross-build:
    if: ${{ !inputs.skip_macos && inputs.reuse_platforms_from_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2

      - name: Install LLVM 23 and cross-build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 23
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev nasm g++
          echo "BUN_TOOLCHAIN_LLVM=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Record Linux build host and Darwin target
        working-directory: bun
        run: |
          uname -a
          git rev-parse HEAD
          bun --version

      - name: Cross-build Darwin x64 release Bun
        working-directory: bun
        env:
          BUILDKITE_COMMIT: ${{ inputs.bun_sha }}
        run: bun run build --profile=release --ci=on --os=darwin --arch=x64

      - name: Preserve macOS binary mode in a tar archive
        run: tar -czf "$RUNNER_TEMP/bun-profile.tar.gz" -C bun/build/release bun-profile

      - name: Upload macOS x64 release binary
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-macos-x64-release
          path: ${{ runner.temp }}/bun-profile.tar.gz
          compression-level: 0
          if-no-files-found: error

  macos-x64:
    if: ${{ !cancelled() && !inputs.skip_macos && (inputs.reuse_platforms_from_run != '' || needs.macos-x64-cross-build.result == 'success') }}
    needs: [macos-x64-cross-build]
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Download prebuilt macOS x64 binary archive
        if: ${{ inputs.reuse_platforms_from_run == '' }}
        uses: actions/download-artifact@v4
        with:
          name: pr31000-macos-x64-release
          path: bun/build/release-artifact

      - name: Reuse macOS x64 binary from a prior run
        if: ${{ inputs.reuse_platforms_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: pr31000-macos-x64-release
          github-token: ${{ github.token }}
          repository: agaricus/bun
          run-id: ${{ inputs.reuse_platforms_from_run }}
          path: bun/build/release-artifact

      - name: Restore executable mode
        working-directory: bun
        run: |
          mkdir -p build/release
          tar -xzf build/release-artifact/bun-profile.tar.gz -C build/release

      - name: Run focused suites with the downloaded binary
        working-directory: bun
        shell: bash
        env:
          BUN_DEBUG_QUIET_LOGS: "1"
          BUN_FEATURE_FLAG_INTERNAL_FOR_TESTING: "1"
        run: |
          set -o pipefail
          ./build/release/bun-profile --expose-internals test --timeout=90000 \
            test/cli/install/npmrc.test.ts \
            test/js/web/fetch/fetch.tls.test.ts \
            test/js/web/fetch/fetch-redirect.test.ts \
            test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts \
            test/cli/install/bun-install-retry.test.ts \
            test/cli/install/bun-pm-diff.test.ts 2>&1 | tee ../macos-test.log

      - name: Publish reused macOS binary for downstream release
        if: ${{ inputs.reuse_platforms_from_run != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-macos-x64-release
          path: bun/build/release-artifact/bun-profile.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-macos-x64-${{ inputs.bun_sha }}
          path: macos-test.log
          if-no-files-found: ignore

  linux-x64-build:
    if: ${{ !inputs.skip_linux && inputs.reuse_platforms_from_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2

      - name: Install LLVM 23 and native build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 23
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev nasm g++
          echo "BUN_TOOLCHAIN_LLVM=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      - name: Record runner and revision
        working-directory: bun
        run: |
          uname -a
          git rev-parse HEAD
          bun --version

      - name: Build release Bun
        working-directory: bun
        env:
          BUILDKITE_COMMIT: ${{ inputs.bun_sha }}
        run: bun run build --profile=release --ci=on

      - name: Preserve Linux binary mode in a tar archive
        run: tar -czf "$RUNNER_TEMP/bun-profile.tar.gz" -C bun/build/release bun-profile

      - name: Upload Linux x64 release binary
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-linux-x64-release
          path: ${{ runner.temp }}/bun-profile.tar.gz
          compression-level: 0
          if-no-files-found: error

  linux-x64:
    if: ${{ !cancelled() && !inputs.skip_linux && (inputs.reuse_platforms_from_run != '' || needs.linux-x64-build.result == 'success') }}
    needs: [linux-x64-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Download prebuilt Linux x64 binary archive
        if: ${{ inputs.reuse_platforms_from_run == '' }}
        uses: actions/download-artifact@v4
        with:
          name: pr31000-linux-x64-release
          path: bun/build/release-artifact

      - name: Reuse Linux x64 binary from a prior run
        if: ${{ inputs.reuse_platforms_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: pr31000-linux-x64-release
          github-token: ${{ github.token }}
          repository: agaricus/bun
          run-id: ${{ inputs.reuse_platforms_from_run }}
          path: bun/build/release-artifact

      - name: Restore executable mode
        working-directory: bun
        run: |
          mkdir -p build/release
          tar -xzf build/release-artifact/bun-profile.tar.gz -C build/release

      - name: Verify downloaded Linux binary revision
        working-directory: bun
        shell: bash
        env:
          BUN_DEBUG_QUIET_LOGS: "1"
          BUN_FEATURE_FLAG_INTERNAL_FOR_TESTING: "1"
          EXPECTED_BUN_SHA: ${{ inputs.bun_sha }}
        run: |
          actual=$(./build/release/bun-profile -p 'Bun.revision')
          test "$actual" = "$EXPECTED_BUN_SHA"

      - name: Run focused suites with the downloaded binary
        working-directory: bun
        shell: bash
        env:
          BUN_DEBUG_QUIET_LOGS: "1"
          BUN_FEATURE_FLAG_INTERNAL_FOR_TESTING: "1"
        run: |
          set -o pipefail
          ./build/release/bun-profile --expose-internals test --timeout=90000 test/cli/install/npmrc.test.ts test/js/web/fetch/fetch.tls.test.ts test/js/web/fetch/fetch-redirect.test.ts test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts test/cli/install/bun-install-retry.test.ts test/cli/install/bun-pm-diff.test.ts 2>&1 | tee ../linux-test.log

      - name: Publish reused Linux binary for downstream release
        if: ${{ inputs.reuse_platforms_from_run != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-linux-x64-release
          path: bun/build/release-artifact/bun-profile.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-linux-x64-${{ inputs.bun_sha }}
          path: linux-test.log
          if-no-files-found: ignore

  windows-build:
    if: ${{ !inputs.skip_windows && inputs.reuse_platforms_from_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun
      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
      - name: Install LLVM 23 and native build tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 23
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23-dev nasm g++
          echo "BUN_TOOLCHAIN_LLVM=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
      - name: Cross-build Windows x64 release binary
        working-directory: bun
        env:
          BUILDKITE_COMMIT: ${{ inputs.bun_sha }}
        run: bun run build --profile=windows-x64-release --ci=on
      - name: Upload Windows binary for native tests
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-windows-x64-release
          path: bun/build/release-windows-x64/bun-profile.exe
          if-no-files-found: error

  windows-x64:
    if: ${{ !cancelled() && !inputs.skip_windows && (inputs.reuse_platforms_from_run != '' || needs.windows-build.result == 'success') }}
    needs: [windows-build]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun
      - name: Download cross-built Windows binary
        if: ${{ inputs.reuse_platforms_from_run == '' }}
        uses: actions/download-artifact@v4
        with:
          name: pr31000-windows-x64-release
          path: bun/build/release-windows-x64

      - name: Reuse Windows binary from a prior run
        if: ${{ inputs.reuse_platforms_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: pr31000-windows-x64-release
          github-token: ${{ github.token }}
          repository: agaricus/bun
          run-id: ${{ inputs.reuse_platforms_from_run }}
          path: bun/build/release-windows-x64

      - name: Verify downloaded Windows binary revision
        shell: pwsh
        env:
          BUN_DEBUG_QUIET_LOGS: "1"
          BUN_FEATURE_FLAG_INTERNAL_FOR_TESTING: "1"
          EXPECTED_BUN_SHA: ${{ inputs.bun_sha }}
        run: |
          $actual = (& .\bun\build\release-windows-x64\bun-profile.exe -p 'Bun.revision').Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_BUN_SHA) {
            throw "Unexpected Windows binary revision: $actual"
          }
      - name: Run focused suites with the cross-built Windows release binary
        shell: pwsh
        env:
          BUN_DEBUG_QUIET_LOGS: "1"
          BUN_FEATURE_FLAG_INTERNAL_FOR_TESTING: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          subst B: "$env:GITHUB_WORKSPACE\bun"
          Set-Location 'B:\'
          & .\build\release-windows-x64\bun-profile.exe --expose-internals test --timeout=90000 test/cli/install/npmrc.test.ts test/js/web/fetch/fetch.tls.test.ts test/js/web/fetch/fetch-redirect.test.ts test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts test/cli/install/bun-install-retry.test.ts test/cli/install/bun-pm-diff.test.ts 2>&1 | Tee-Object -FilePath windows-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish reused Windows binary for downstream release
        if: ${{ inputs.reuse_platforms_from_run != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-windows-x64-release
          path: bun/build/release-windows-x64/bun-profile.exe
          if-no-files-found: error

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-windows-x64-${{ inputs.bun_sha }}
          path: bun/windows-test.log
          if-no-files-found: ignore

  publish-prerelease:
    if: ${{ !inputs.skip_macos && !inputs.skip_windows && !inputs.skip_linux }}
    needs: [macos-x64, windows-x64, linux-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested platform binaries
        uses: actions/download-artifact@v4
        with:
          name: pr31000-macos-x64-release
          path: release-inputs/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: pr31000-windows-x64-release
          path: release-inputs/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: pr31000-linux-x64-release
          path: release-inputs/linux-x64

      - name: Extract macOS and Linux binaries from tar archives
        run: |
          tar -xzf release-inputs/darwin-x64/bun-profile.tar.gz -C release-inputs/darwin-x64
          tar -xzf release-inputs/linux-x64/bun-profile.tar.gz -C release-inputs/linux-x64

      - name: Package Maven JARs and ZIPs from tested binaries
        env:
          BUN_SHA: ${{ inputs.bun_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('release-inputs')
          out = pathlib.Path('release-assets')
          out.mkdir()
          version = f"1.4.4-pr31000-{__import__('os').environ['BUN_SHA'][:11]}"
          for target, exe_name in [('darwin-x64', 'bun'), ('windows-x64', 'bun.exe'), ('linux-x64', 'bun')]:
              pattern = 'bun-profile.exe' if target == 'windows-x64' else 'bun-profile'
              files = list((root / target).glob(pattern))
              if len(files) != 1:
                  raise SystemExit(f'{target}: expected one tested release Bun binary, found {files}')
              binary = files[0]
              dest = out / f'bun-{target}-{version}'
              dest.mkdir()
              exe = dest / exe_name
              exe.write_bytes(binary.read_bytes())
              exe.chmod(0o755)
              digest = hashlib.sha256(exe.read_bytes()).hexdigest()
              manifest = {'artifact_version': version, 'source_commit': __import__('os').environ['BUN_SHA'], 'target': target, 'profile': 'release', 'binary': exe_name, 'binary_sha256': digest, 'official_release': False}
              (dest / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
              (dest / 'README.txt').write_text('Temporary release binary built and tested in the PR 31000 fork workflow. Not an official Bun release.\n')
              zip_path = out / f'bun-{target}-{version}.zip'
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
                  z.write(exe, exe_name)
                  z.write(dest / 'manifest.json', 'manifest.json')
                  z.write(dest / 'README.txt', 'README.txt')
              jar_path = out / f'bun-{target}-{version}.jar'
              with zipfile.ZipFile(jar_path, 'w', zipfile.ZIP_DEFLATED) as z:
                  z.write(exe, f'META-INF/resources/_static/pr31000/{version}/bin/{exe_name}')
                  z.write(dest / 'manifest.json', 'META-INF/pr31000-build.json')
                  z.write(dest / 'README.txt', 'META-INF/README.txt')
          sums = []
          for path in sorted(out.iterdir()):
              if path.is_file(): sums.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}')
          (out / 'SHA256SUMS').write_text('\n'.join(sums) + '\n')
          PY

      - name: Upload assets to temporary prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload pr31000-056352c391c --repo agaricus/bun release-assets/* --clobber
