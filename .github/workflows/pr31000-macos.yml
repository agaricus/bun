name: PR 31000 macOS verification

on:
  workflow_dispatch:
    inputs:
      bun_sha:
        description: Full commit SHA from oven-sh/bun to test
        required: true
        type: string
        default: 056352c391c0d6b476bace1f41874dc9b4d9c5d9

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2

      - name: Install LLVM 23.1.1.1.1
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
        run: micromamba create -y -p "$RUNNER_TEMP/llvm23" -c conda-forge llvm=23.1.1 clang=23.1.1 && echo "BUN_TOOLCHAIN_LLVM=$RUNNER_TEMP/llvm23" >> "$GITHUB_ENV"

      - name: Record runner and revision
        working-directory: bun
        run: |
          uname -a
          git rev-parse HEAD
          bun --version

      - name: Build debug Bun and run focused suites
        working-directory: bun
        shell: bash
        run: |
          set -o pipefail
          BUN_TOOLCHAIN_LLVM="$(brew --prefix llvm)" bun bd test \
            test/cli/install/npmrc.test.ts \
            test/js/web/fetch/fetch.tls.test.ts \
            test/js/web/fetch/fetch-redirect.test.ts \
            test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts \
            test/cli/install/bun-install-retry.test.ts \
            test/cli/install/bun-pm-diff.test.ts 2>&1 | tee ../macos-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-macos-${{ inputs.bun_sha }}
          path: macos-test.log
          if-no-files-found: ignore
