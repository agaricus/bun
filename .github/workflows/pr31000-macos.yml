name: PR 31000 cross-platform verification

on:
  workflow_dispatch:
    inputs:
      bun_sha:
        description: Full commit SHA from oven-sh/bun to test
        required: true
        type: string
        default: 056352c391c0d6b476bace1f41874dc9b4d9c5d9
      skip_macos:
        description: Skip macOS when rerunning selected lanes
        required: false
        type: boolean
        default: false
      skip_windows:
        description: Skip Windows when rerunning selected lanes
        required: false
        type: boolean
        default: false
      skip_linux:
        description: Skip Linux when rerunning selected lanes
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-x64:
    if: ${{ !inputs.skip_macos }}
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash

      - name: Install LLVM 23.1.1
        shell: bash -el {0}
        run: |
          micromamba create -y -p "$RUNNER_TEMP/llvm23" -c conda-forge llvm=23.1.1 clang=23.1.1
          echo "BUN_TOOLCHAIN_LLVM=$RUNNER_TEMP/llvm23" >> "$GITHUB_ENV"

      - name: Install NASM
        run: brew install nasm

      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch "$XCODE_26_DEVELOPER_DIR"
          xcodebuild -version

      - name: Record runner and revision
        working-directory: bun
        run: |
          uname -a
          git rev-parse HEAD
          bun --version

      - name: Build debug Bun and run focused suites
        working-directory: bun
        shell: bash
        run: |
          set -o pipefail
          bun bd test \
            test/cli/install/npmrc.test.ts \
            test/js/web/fetch/fetch.tls.test.ts \
            test/js/web/fetch/fetch-redirect.test.ts \
            test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts \
            test/cli/install/bun-install-retry.test.ts \
            test/cli/install/bun-pm-diff.test.ts 2>&1 | tee ../macos-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-macos-x64-${{ inputs.bun_sha }}
          path: macos-test.log
          if-no-files-found: ignore

  linux-x64:
    if: ${{ !inputs.skip_linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash

      - name: Install LLVM 23.1.1 and NASM
        shell: bash -el {0}
        run: |
          micromamba create -y -p "$RUNNER_TEMP/llvm23" -c conda-forge llvm=23.1.1 llvm-tools=23.1.1 lld=23.1.1 clang=23.1.1
          echo "BUN_TOOLCHAIN_LLVM=$RUNNER_TEMP/llvm23" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/llvm23/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build debug Bun and run focused suites
        working-directory: bun
        shell: bash
        run: |
          set -o pipefail
          bun bd test test/cli/install/npmrc.test.ts test/js/web/fetch/fetch.tls.test.ts test/js/web/fetch/fetch-redirect.test.ts test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts test/cli/install/bun-install-retry.test.ts test/cli/install/bun-pm-diff.test.ts 2>&1 | tee ../linux-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-linux-x64-${{ inputs.bun_sha }}
          path: linux-test.log
          if-no-files-found: ignore

  windows-x64:
    if: ${{ !inputs.skip_windows }}
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout Bun revision
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: ${{ inputs.bun_sha }}
          path: bun

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2

      - name: Install LLVM 23.1.1 and NASM
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'LLVM-23.1.1-win64.msi'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-win64.msi'
          Invoke-WebRequest -Uri $url -OutFile $msi
          $proc = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "LLVM MSI exited with $($proc.ExitCode)" }
          $installDir = Join-Path $env:ProgramFiles 'LLVM'
          if (!(Test-Path (Join-Path $installDir 'bin\clang-cl.exe'))) { throw "clang-cl.exe missing from $installDir" }
          & (Join-Path $installDir 'bin\clang-cl.exe') --version
          "BUN_TOOLCHAIN_LLVM=$installDir" >> $env:GITHUB_ENV
          "$installDir\bin" >> $env:GITHUB_PATH
          choco install nasm -y --no-progress

      - name: Build debug Bun and run focused suites
        working-directory: bun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File .\scripts\vs-shell.ps1 bun bd test test/cli/install/npmrc.test.ts test/js/web/fetch/fetch.tls.test.ts test/js/web/fetch/fetch-redirect.test.ts test/js/web/fetch/fetch-proxy-tls-intern-race.test.ts test/cli/install/bun-install-retry.test.ts test/cli/install/bun-pm-diff.test.ts 2>&1 | Tee-Object -FilePath ../windows-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr31000-windows-x64-${{ inputs.bun_sha }}
          path: windows-test.log
          if-no-files-found: ignore
